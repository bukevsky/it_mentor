spring:
  application:
    name: it.mentor
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:itmentor}
    username: ${DB_USER:itmentor}
    password: ${DB_PASSWORD:itmentor}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      jakarta:
        persistence:
          query:
            timeout: 10000
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@itmentor.local}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE-ME-set-JWT_SECRET-env-var-in-production-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  otp:
    expiration-minutes: 15
    max-attempts: 5
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:itmentor}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"
  level:
    com.example.it.mentor: INFO
    org.springframework.security: WARN
    liquibase: WARN
