<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head><meta charset="UTF-8"/></head>
<body>
<div th:fragment="body-content">
  <p>Здравствуйте, <strong th:text="${recipientName}">Имя</strong>!</p>
  <p>По вашей заявке запрошено уточнение.</p>
  <p th:if="${clarificationNote != null and !#strings.isEmpty(clarificationNote)}">
    <em th:text="${clarificationNote}"></em>
  </p>
  <a th:href="${actionUrl}" class="btn">Ответить на заявку</a>
</div>
</body>
</html>
