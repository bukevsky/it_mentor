spring:
  datasource:
    url: jdbc:tc:postgresql:15:///itmentor
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    secret: test-secret-key-must-be-at-least-32-characters-long-for-tests
  storage:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: testsecret
    bucket-name: itmentor-test

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
  level:
    com.example.it.mentor: DEBUG
    org.springframework.security: WARN
    liquibase: INFO
