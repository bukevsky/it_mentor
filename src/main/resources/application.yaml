spring:
  application:
    name: it.mentor
  liquibase:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 30000
  jpa:
    properties:
      jakarta:
        persistence:
          query:
            timeout: 10000
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE-ME-set-JWT_SECRET-env-var-in-production-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.it.mentor: INFO
    org.springframework.security: WARN
    liquibase: WARN
