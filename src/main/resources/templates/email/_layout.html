<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
.wrapper { max-width: 600px; margin: 24px auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
.header { background: #1a56db; padding: 24px 32px; }
.header h1 { color: #ffffff; margin: 0; font-size: 20px; }
.content { padding: 32px; color: #333333; font-size: 15px; line-height: 1.6; }
.btn { display: inline-block; margin-top: 24px; padding: 12px 28px; background: #1a56db; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 15px; }
.footer { padding: 16px 32px; background: #f5f5f5; color: #888888; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header"><h1>IT Mentor</h1></div>
  <div class="content" th:replace="~{::body-content}">Контент письма</div>
  <div class="footer">Вы получили это письмо, потому что являетесь участником платформы IT Mentor.</div>
</div>
</body>
</html>
