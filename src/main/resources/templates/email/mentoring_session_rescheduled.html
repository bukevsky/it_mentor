<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head><meta charset="UTF-8"/></head>
<body>
<div th:fragment="body-content">
  <p>Здравствуйте, <strong th:text="${recipientName}">Имя</strong>!</p>
  <p>Сессия менторинга перенесена.</p>
  <ul>
    <li>Новая дата и время: <strong th:text="${scheduledAt}">—</strong></li>
    <li>Продолжительность: <strong th:text="${durationMinutes} + ' мин.'">—</strong></li>
    <li th:if="${reason != null and !#strings.isEmpty(reason)}">Причина: <em th:text="${reason}"></em></li>
  </ul>
  <a th:href="${actionUrl}" class="btn">Открыть сессию</a>
</div>
</body>
</html>
