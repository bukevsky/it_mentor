spring:
  datasource:
    url: jdbc:tc:postgresql:15:///itmentor
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    secret: test-secret-key-must-be-at-least-32-characters-long-for-tests
    expiration-ms: 86400000
  storage:
    endpoint: http://localhost:9000
    access-key: testkey
    secret-key: testsecret
    bucket-name: itmentor-test
  cors:
    allowed-origins: http://localhost:3000

logging:
  structured:
    format:
      console:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:--}] %logger{36} - %msg%n"
  level:
    com.example.it.mentor: DEBUG
    org.springframework.security: WARN
    liquibase: INFO
